spring.config.import=optional:classpath:secrets.properties
server.port=${PORT:8080}

# Plugin storage — override via env var HUB_PLUGINS_DIR or hub.plugins.dir in Docker
hub.plugins.dir=${user.home}/.homeforge/plugins
logging.level.org.atmosphere=warn
logging.level.org.hibernate=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.dsquare68


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:home_forge_db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# DBProperties reads DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD / DB_SCHEMA
# directly (same values as spring.datasource above), and is the single source for
# every connection DBConnection opens — including the per-plugin pools.
# Optional tuning, defaults shown:
#   DB_MAX_POOL_SIZE=5
#   DB_CONNECT_TIMEOUT_SECONDS=5
#   DB_SOCKET_TIMEOUT_SECONDS=10
#   DB_APPLICATION_NAME=homeforge

hub.plugin-store.url=${URL:}
hub.plugin-store.user=hubclient
hub.plugin-store.password=${SERWER_PASSWORD:}
hub.plugin-store.index=/metadata/plugins.json
hub.plugin-store.trust-self-signed=true