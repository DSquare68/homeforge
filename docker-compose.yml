services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_forge_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d home_forge_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA:-hub_schema}
      # docker-compose users provide DB_USER/DB_PASSWORD via .env up front (no
      # walk-up /sign-in setup needed), so it's safe to always migrate the schema.
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/home_forge_db
      URL: ${PLUGIN_STORE_URL}
      SERWER_PASSWORD: ${SERWER_PASSWORD}
    volumes:
      - plugins_data:/app/.homeforge/plugins
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
  plugins_data:
